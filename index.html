<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Fridge Inventory System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Smart Fridge Inventory System</h1>
  </header>

  <main>
    <div class="card">
      <h2>Current Inventory</h2>
      <table id="inventoryTable">
        <thead>
          <tr>
            <th>Item ID</th>
            <th>Name</th>
            <th>Storage time</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Simulation Controls (Demo)</h2>
      <div class="controls">
        <button id="addBtn">Simulate Add Item</button>
        <button id="removeBtn" class="secondary">Simulate Remove Item</button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
