<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Fridge Inventory System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>Smart Fridge Inventory System</h1>
</header>

<main>

<div class="card">
  <div class="toolbar">
    <h2 style="margin:0;">Manual Controls</h2>
    <span class="hint">Auto refresh every 5 seconds</span>
  </div>

  <div class="controls">
    <label>
      Item:
      <input id="itemInput" type="text" placeholder="e.g., apple" />
    </label>

    <label>
      Year:
      <input id="manualYearInput" type="number" placeholder="2026" />
    </label>

    <label>
      Month:
      <input id="manualMonthInput" type="number" placeholder="03" min="1" max="12" />
    </label>

    <label>
      Day:
      <input id="manualDayInput" type="number" placeholder="1" min="1" max="31" />
    </label>

    <label>
      Hour:
      <input id="manualHourInput" type="number" placeholder="12" min="0" max="23" />
    </label>

    <button id="addBtn">Add (IN_FRIDGE)</button>
    <button id="removeBtn" class="secondary">Remove (REMOVED)</button>

    <span id="actionStatus" class="status">Idle</span>
  </div>
</div>


<div class="card">
  <div class="toolbar">
    <h2 style="margin:0;">Current Inventory</h2>
    <div class="toolbar-right">
      <button id="refreshBtn">Refresh</button>
      <span id="statusText" class="status">Idle</span>
    </div>
  </div>

  <table id="inventoryTable">
    <thead>
      <tr>
        <th>item_name</th>
        <th>quantity</th>
        <th>earliest_put_in_time</th>
        <th>latest_put_in_time</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>


<!-- Collision Modal -->

<div id="collisionModal" class="modal hidden">

  <div class="modal-backdrop"></div>

  <div class="modal-panel">

    <div class="modal-header">

      <h2 style="margin:0;">Action Required</h2>

    </div>

    <div class="hint" style="margin-top:6px;">
      Review each open collision case below.
    </div>

    <div id="collisionCardList" class="collision-card-list"></div>

  </div>

</div>

<div id="manualRemoveModal" class="modal hidden">
  <div class="modal-backdrop"></div>

  <div class="modal-panel">
    <div class="modal-header">
      <h2 style="margin:0;">Manual Remove</h2>
    </div>

    <div class="hint" id="manualRemoveTitle" style="margin-top:6px;"></div>

    <p id="manualRemoveSummary" style="margin-top:12px;"></p>

    <div class="card" style="margin-top:12px; margin-bottom:0;">
      <div class="toolbar">
        <h3 style="margin:0;">Select item(s) to remove</h3>
      </div>

      <div id="manualRemoveItems" class="collision-item-list"></div>
    </div>

    <div class="modal-actions">
      <button id="manualRemoveConfirmBtn">Confirm</button>
      <button id="manualRemoveCancelBtn" class="secondary">Cancel</button>
      <span id="manualRemoveStatus" class="status">Idle</span>
    </div>
  </div>
</div>

</main>

<script src="app.js"></script>

</body>
</html>
