<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Fridge Inventory System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>Smart Fridge Inventory System</h1>
</header>

<main>

<div class="card">
  <div class="toolbar">
    <h2 style="margin:0;">Manual Controls</h2>
    <span class="hint">Auto refresh every 5 seconds</span>
  </div>

  <div class="controls">
    <label>
      Item:
      <input id="itemInput" type="text" placeholder="e.g., apple" />
    </label>

    <button id="addBtn">Add (IN_FRIDGE)</button>
    <button id="removeBtn" class="secondary">Remove (REMOVED)</button>

    <span id="actionStatus" class="status">Idle</span>
  </div>
</div>


<div class="card">
  <div class="toolbar">
    <h2 style="margin:0;">Current Inventory</h2>
    <div class="toolbar-right">
      <button id="refreshBtn">Refresh</button>
      <span id="statusText" class="status">Idle</span>
    </div>
  </div>

  <table id="inventoryTable">
    <thead>
      <tr>
        <th>item_name</th>
        <th>quantity</th>
        <th>earliest_put_in_time</th>
        <th>latest_put_in_time</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>


<!-- Collision Modal -->

<div id="collisionModal" class="modal hidden">

  <div class="modal-backdrop"></div>

  <div class="modal-panel">

    <div class="modal-header">

      <h2 style="margin:0;">Action Required</h2>

      <div class="hint" style="margin-top:6px;">
        Item:
        <select id="collisionCaseSelect"></select>
      </div>

    </div>

    <p id="collisionSummary" style="margin-top:12px;"></p>

    <div class="card" style="margin-top:12px;">

      <div class="toolbar">
        <h3 style="margin:0;">Select item to remove</h3>
      </div>

      <div id="collisionItems"></div>

    </div>

    <div class="modal-actions">
      <button id="collisionConfirmBtn">Confirm</button>
      <span id="collisionStatus" class="status">Idle</span>
    </div>

  </div>

</div>

</main>

<script src="app.js"></script>

</body>
</html>
